kind: Pod
apiVersion: v1
metadata:
  name: nginx-html-pod
  namespace: nginx
  labels:
    app: nginx-html
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-volume
      configMap:
        name: html-config